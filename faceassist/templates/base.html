<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title or "Blind Assist" }}</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 0; line-height: 1.5; }
    header { padding: 16px; background: #111; color: #fff; }
    nav { display:flex; flex-wrap:wrap; gap:10px 22px; align-items:flex-start; }
    .nav-group { display:flex; flex-direction:column; gap:4px; min-width:180px; }
    .nav-title { font-size:12px; text-transform:uppercase; letter-spacing:0.08em; color:#bbb; }
    .nav-links { display:flex; flex-wrap:wrap; gap:8px 12px; }
    nav a { color: #fff; font-size: 18px; text-decoration:none; }
    nav a:hover { text-decoration:underline; }
    main { padding: 16px; max-width: 1100px; margin: 0 auto; }
    .btn { font-size: 20px; padding: 14px 18px; border: 0; border-radius: 10px; cursor: pointer; }
    .btn-primary { background: #0b5; color: #000; }
    .btn-danger { background: #e33; color: #fff; }
    .card { border: 2px solid #ddd; border-radius: 14px; padding: 14px; margin: 12px 0; }
    .muted { color: #555; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    img { max-width: 100%; height: auto; border-radius: 12px; }
  </style>
</head>
<body>
  <header>
    <nav aria-label="Hoofdmenu">
      <div class="nav-group">
        <div class="nav-title">Apps</div>
        <div class="nav-links">
          <a href="{{ url_for('personen') }}">Personen herkennen</a>
          <a href="{{ url_for('segmentation_page') }}">Pad detectie</a>
        </div>
      </div>

      <div class="nav-group">
        <div class="nav-title">Tests</div>
        <div class="nav-links">
          <a href="{{ url_for('camera_page') }}">Camerastream testen</a>
          <a href="{{ url_for('mobile_face_page') }}">Mobiele gezichtsdetectie</a>
          <a href="{{ url_for('annotate_photo_page') }}">Foto annoteren</a>
        </div>
      </div>

      <div class="nav-group">
        <div class="nav-title">Beheer</div>
        <div class="nav-links">
          <a href="{{ url_for('faces_extract_page') }}">Gezichten uit foto</a>
          <a href="{{ url_for('unknown_page') }}">Beheer gezichten</a>
          <a href="{{ url_for('unknown_process_page') }}">Verwerk ongekende gezichten</a>
        </div>
      </div>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
