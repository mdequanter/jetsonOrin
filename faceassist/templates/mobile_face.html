{% extends "base.html" %}
{% set title = "Mobiele gezichtsdetectie" %}

{% block content %}
  <h1>Mobiele gezichtsdetectie</h1>
  <p class="muted">Deze pagina gebruikt DroidCam via <code>{{ stream_url }}</code>. Herkenning (gekend/onbekend) wordt in de stream geannoteerd.</p>

  <div class="card">
    <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px;">
      <button id="reloadBtn" class="btn btn-primary" type="button">Herlaad stream</button>
      <form method="post" action="{{ url_for('mobile_face_reconnect') }}" style="margin:0;">
        <button class="btn btn-danger" type="submit">Forceer reconnect</button>
      </form>
    </div>
    <div id="status" class="muted">Stream wordt geladen...</div>
  </div>

  <div class="card" style="max-width:900px;">
    <div style="position:relative; width:100%; aspect-ratio:3/4; background:#000; border-radius:12px; overflow:hidden;">
      <img id="stream" src="{{ url_for('mobile_face_feed') }}" alt="DroidCam stream" style="width:100%; height:100%; object-fit:cover; display:block;">
    </div>
  </div>

  <script>
    const streamEl = document.getElementById("stream");
    const reloadBtn = document.getElementById("reloadBtn");
    const statusEl = document.getElementById("status");

    function setStatus(t) { statusEl.textContent = t; }

    function reloadStream() {
      const base = "{{ url_for('mobile_face_feed') }}";
      streamEl.src = `${base}?t=${Date.now()}`;
      setStatus("Stream opnieuw laden...");
    }

    streamEl.onload = () => {
      setStatus("Stream actief.");
    };

    streamEl.onerror = () => {
      setStatus("Stream fout. Controleer DroidCam (IP/poort) en klik Herlaad stream.");
    };

    reloadBtn.addEventListener("click", reloadStream);

    setInterval(() => {
      if (!streamEl.complete || streamEl.naturalWidth === 0) {
        reloadStream();
      }
    }, 4000);
  </script>
{% endblock %}
